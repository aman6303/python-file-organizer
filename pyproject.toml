[project]
name = "python-file-organizer"
version = "0.1.0"
description = "A command-line tool that finds duplicate files by content hash and organizes files into folders by type."
readme = "README.md"
authors = [
    { name = "Aman Singh", email = "singhaman1232002@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
python-file-organizer = "python_file_organizer.main:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
